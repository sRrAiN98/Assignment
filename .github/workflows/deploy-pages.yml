name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'charts/resume-web/files/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Prepare Pages Bundle
        run: |
          mkdir -p _site
          cp -r charts/resume-web/files/* _site/
          if [ -f "docs/Kubernetes_구축결과서_장재희.pdf" ]; then
            cp "docs/Kubernetes_구축결과서_장재희.pdf" _site/
            cp "docs/Kubernetes_구축결과서_장재희.pdf" _site/submission.pdf
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

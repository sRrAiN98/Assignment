# Traefik Ingress & Security Middleware Manifests
# Single entrypoint (HTTP Port 80) routing with internal-only IP protection

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: allow-internal-only
  namespace: argocd
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/16
      - 10.0.0.0/8
      - 127.0.0.1/32

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: argocd-allow-internal-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: argo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: allow-internal-only
  namespace: gitea
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/16
      - 10.0.0.0/8
      - 127.0.0.1/32

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress
  namespace: gitea
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: gitea-allow-internal-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: git.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitea-http
            port:
              number: 3000

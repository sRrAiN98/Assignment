apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resume-web.fullname" . }}
  labels:
    {{- include "resume-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "resume-web.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
        checksum/content: {{ printf "%s%s%s" ($.Files.Get "files/index.html") ($.Files.Get "files/bootstrap.min.css") ($.Files.Get "files/bootstrap.bundle.min.js") | sha256sum }}
      {{- else }}
      annotations:
        checksum/content: {{ printf "%s%s%s" (.Files.Get "files/index.html") (.Files.Get "files/bootstrap.min.css") (.Files.Get "files/bootstrap.bundle.min.js") | sha256sum }}
      {{- end }}
      labels:
        {{- include "resume-web.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "resume-web.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: assets
              mountPath: /usr/share/nginx/html/bootstrap.min.css
              subPath: bootstrap.min.css
              readOnly: true
            - name: assets
              mountPath: /usr/share/nginx/html/bootstrap.bundle.min.js
              subPath: bootstrap.bundle.min.js
              readOnly: true
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: html
          configMap:
            name: {{ include "resume-web.fullname" . }}-html
        - name: assets
          configMap:
            name: {{ include "resume-web.fullname" . }}-assets
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
